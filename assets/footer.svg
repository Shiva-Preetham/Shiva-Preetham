<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for stopping by. Let&#x27;s build AI that shows its work.">
<title>Thanks for stopping by. Let&#x27;s build AI that shows its work.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}
@keyframes slide{to{transform:translateX(-600px)}}@keyframes slide2{from{transform:translateX(-480px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="frame"><rect width="1200" height="150" rx="22"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="150" fill="url(#bg)"/>
<rect width="1200" height="150" fill="url(#dots)" opacity=".55"/>
<circle cx="600" cy="200" r="260" fill="#A78BFA" opacity="0.18" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="148.5" rx="22" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<g clip-path="url(#frame)">
<path d="M0 118 Q 75.0 104 150.0 118 T 300 118 Q 375.0 104 450.0 118 T 600 118 Q 675.0 104 750.0 118 T 900 118 Q 975.0 104 1050.0 118 T 1200 118 Q 1275.0 104 1350.0 118 T 1500 118 Q 1575.0 104 1650.0 118 T 1800 118 Q 1875.0 104 1950.0 118 T 2100 118 Q 2175.0 104 2250.0 118 T 2400 118 Q 2475.0 104 2550.0 118 T 2700 118 V 150 H 0 Z" fill="url(#accent)" opacity=".22" style="animation:slide 9s linear infinite"/>
<path d="M0 128 Q 60.0 118 120.0 128 T 240 128 Q 300.0 118 360.0 128 T 480 128 Q 540.0 118 600.0 128 T 720 128 Q 780.0 118 840.0 128 T 960 128 Q 1020.0 118 1080.0 128 T 1200 128 Q 1260.0 118 1320.0 128 T 1440 128 Q 1500.0 118 1560.0 128 T 1680 128 Q 1740.0 118 1800.0 128 T 1920 128 Q 1980.0 118 2040.0 128 T 2160 128 Q 2220.0 118 2280.0 128 T 2400 128 Q 2460.0 118 2520.0 128 T 2640 128 V 150 H 0 Z" fill="url(#accent)" opacity=".16" style="animation:slide2 14s linear infinite"/>
</g>
<text x="600" y="64" class="sans b" font-size="26" fill="#E6EDF3" text-anchor="middle" >Thanks for stopping by!</text>
<text x="600" y="96" class="mono" font-size="16" fill="#8B98B0" text-anchor="middle" >Let&#x27;s build AI that shows its work.</text>
</svg>
