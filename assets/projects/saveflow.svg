<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SaveFlow: Agent that rescues cancelling PayPal subscribers, with guardrails in code.">
<title>SaveFlow: Agent that rescues cancelling PayPal subscribers, with guardrails in code.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#dots)" opacity=".55"/>
<circle cx="540" cy="30" r="150" fill="#38BDF8" opacity="0.22" filter="url(#blur)"/><circle cx="80" cy="330" r="120" fill="#A78BFA" opacity="0.1" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="20" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<rect x="28" y="26" width="170" height="26" rx="13" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".5"/>
<text x="41" y="43.5" class="mono b" font-size="12" fill="#38BDF8" text-anchor="start" letter-spacing=".6">PAYPAL AI HACKATHON</text>
<text x="28" y="104" class="sans b" font-size="38" fill="#E6EDF3" text-anchor="start" >SaveFlow</text>
<text x="29" y="138" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >Agent that rescues cancelling PayPal</text>
<text x="29" y="162" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >subscribers, with guardrails in code.</text>
<text x="29" y="234" class="sans b" font-size="32" fill="#38BDF8" text-anchor="start" >0</text>
<text x="30" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">POLICY VIOLATIONS</text>
<text x="201" y="234" class="sans b" font-size="32" fill="#38BDF8" text-anchor="start" >10/10</text>
<text x="202" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">INJECTIONS CAUGHT</text>
<g style="transform-origin:488px 160px;animation:spin 7s linear infinite"><circle cx="488" cy="160" r="66" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="300 114.7"/><path d="M487.9 93.1 L475.9 88.0 L478.2 101.8 Z" fill="#38BDF8"/></g>
<circle cx="488" cy="160" r="44" fill="#38BDF8" fill-opacity=".08" stroke="#38BDF8" stroke-opacity=".35"/>
<rect x="473" y="142" width="10" height="36" rx="3" fill="#38BDF8"/>
<rect x="493" y="142" width="10" height="36" rx="3" fill="#38BDF8"/>
<text x="488" y="264" class="mono" font-size="11" text-anchor="middle" fill="#5B6B8C"><tspan text-decoration="line-through">cancel</tspan><tspan fill="#38BDF8"> → saved</tspan></text>
</svg>
