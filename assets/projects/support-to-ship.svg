<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Support-to-Ship: Customer ticket in, reviewed fix merged, customer answered. 3 agents, 2 humans.">
<title>Support-to-Ship: Customer ticket in, reviewed fix merged, customer answered. 3 agents, 2 humans.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#dots)" opacity=".55"/>
<circle cx="540" cy="30" r="150" fill="#4ADE80" opacity="0.22" filter="url(#blur)"/><circle cx="80" cy="330" r="120" fill="#A78BFA" opacity="0.1" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="20" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<rect x="28" y="26" width="216" height="26" rx="13" fill="#4ADE80" fill-opacity=".12" stroke="#4ADE80" stroke-opacity=".5"/>
<text x="41" y="43.5" class="mono b" font-size="12" fill="#4ADE80" text-anchor="start" letter-spacing=".6">FLIP THE SWITCH HACKATHON</text>
<text x="28" y="104" class="sans b" font-size="38" fill="#E6EDF3" text-anchor="start" >Support-to-Ship</text>
<text x="29" y="138" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >Customer ticket in, reviewed fix merged,</text>
<text x="29" y="162" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >customer answered. 3 agents, 2 humans.</text>
<text x="29" y="234" class="sans b" font-size="32" fill="#4ADE80" text-anchor="start" >3</text>
<text x="30" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">AI AGENTS</text>
<text x="201" y="234" class="sans b" font-size="32" fill="#4ADE80" text-anchor="start" >2</text>
<text x="202" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">HUMAN APPROVALS</text>
<path d="M432 104 L544 104 L488 188 Z" fill="none" stroke="#3B4A6B" stroke-width="1.6" class="flow"/>
<circle r="4.5" fill="#4ADE80"><animateMotion dur="4.2s" begin="-0.0s" repeatCount="indefinite" path="M432 104 L544 104 L488 188 Z"/></circle>
<circle r="4.5" fill="#2DD4BF"><animateMotion dur="4.2s" begin="-2.1s" repeatCount="indefinite" path="M432 104 L544 104 L488 188 Z"/></circle>
<circle cx="432" cy="104" r="23" fill="#0F1424" stroke="#4ADE80" stroke-width="2"/>
<text x="432" y="108" class="mono" font-size="12" fill="#E6EDF3" text-anchor="middle" >sup</text>
<circle cx="544" cy="104" r="23" fill="#0F1424" stroke="#4ADE80" stroke-width="2"/>
<text x="544" y="108" class="mono" font-size="12" fill="#E6EDF3" text-anchor="middle" >fix</text>
<circle cx="488" cy="188" r="23" fill="#0F1424" stroke="#4ADE80" stroke-width="2"/>
<text x="488" y="192" class="mono" font-size="12" fill="#E6EDF3" text-anchor="middle" >rev</text>
<path d="M488 211 L440 236" stroke="#FBBF24" stroke-opacity=".5" stroke-dasharray="3 4"/>
<circle cx="440" cy="238" r="5.5" fill="#FBBF24"/>
<path d="M431 258 a9 9 0 0 1 18 0" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
<text x="440" y="276" class="mono" font-size="10" fill="#FBBF24" text-anchor="middle" >merge ok</text>
<path d="M488 211 L536 236" stroke="#FBBF24" stroke-opacity=".5" stroke-dasharray="3 4"/>
<circle cx="536" cy="238" r="5.5" fill="#FBBF24"/>
<path d="M527 258 a9 9 0 0 1 18 0" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
<text x="536" y="276" class="mono" font-size="10" fill="#FBBF24" text-anchor="middle" >reply ok</text>
</svg>
