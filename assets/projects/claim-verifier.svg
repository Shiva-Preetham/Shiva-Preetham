<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Claim Verifier: Two-pass Gemini vision pipeline that judges damage claims from photo evidence.">
<title>Claim Verifier: Two-pass Gemini vision pipeline that judges damage claims from photo evidence.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#dots)" opacity=".55"/>
<circle cx="540" cy="30" r="150" fill="#A78BFA" opacity="0.22" filter="url(#blur)"/><circle cx="80" cy="330" r="120" fill="#A78BFA" opacity="0.1" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="20" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<rect x="28" y="26" width="193" height="26" rx="13" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".5"/>
<text x="41" y="43.5" class="mono b" font-size="12" fill="#A78BFA" text-anchor="start" letter-spacing=".6">HACKERRANK ORCHESTRATE</text>
<text x="28" y="104" class="sans b" font-size="38" fill="#E6EDF3" text-anchor="start" >Claim Verifier</text>
<text x="29" y="138" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >Two-pass Gemini vision pipeline that</text>
<text x="29" y="162" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >judges damage claims from photo evidence.</text>
<text x="29" y="234" class="sans b" font-size="32" fill="#A78BFA" text-anchor="start" >20/20</text>
<text x="30" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">CLAIM STATUS</text>
<text x="201" y="234" class="sans b" font-size="32" fill="#A78BFA" text-anchor="start" >~$0.02</text>
<text x="202" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">45 CLAIMS · &lt;13 MIN</text>
<defs><clipPath id="shield"><path d="M488 96 L538 113 V158 C538 196 517 220 488 234 C459 220 438 196 438 158 V113 Z"/></clipPath></defs>
<rect x="414" y="58" width="58" height="22" rx="11" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/>
<text x="443" y="73" class="mono" font-size="11" fill="#E6EDF3" text-anchor="middle" >pass 1</text>
<path d="M474 69 L502 69" stroke="#3B4A6B" stroke-width="1.6" class="flow"/>
<rect x="504" y="58" width="58" height="22" rx="11" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/>
<text x="533" y="73" class="mono" font-size="11" fill="#E6EDF3" text-anchor="middle" >pass 2</text>
<path d="M488 96 L538 113 V158 C538 196 517 220 488 234 C459 220 438 196 438 158 V113 Z" fill="#A78BFA" fill-opacity=".09" stroke="#A78BFA" stroke-width="2.2"/>
<g clip-path="url(#shield)"><rect x="430" y="96" width="120" height="2.5" fill="#A78BFA" opacity=".8"><animate attributeName="y" values="96;234;96" dur="3.4s" repeatCount="indefinite"/></rect></g>
<path d="M466 163 l15 15 l30 -32" fill="none" stroke="#4ADE80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" style="--len:70;animation:draw 3.4s ease-in-out infinite"/>
<text x="488" y="264" class="mono" font-size="11" fill="#4ADE80" text-anchor="middle" >supported</text>
</svg>
