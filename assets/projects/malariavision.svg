<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="MalariaVision: Spots malaria parasites in blood-smear cells: OpenCV pipeline + MobileNetV2.">
<title>MalariaVision: Spots malaria parasites in blood-smear cells: OpenCV pipeline + MobileNetV2.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#dots)" opacity=".55"/>
<circle cx="540" cy="30" r="150" fill="#F472B6" opacity="0.22" filter="url(#blur)"/><circle cx="80" cy="330" r="120" fill="#A78BFA" opacity="0.1" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="20" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<rect x="28" y="26" width="140" height="26" rx="13" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/>
<text x="41" y="43.5" class="mono b" font-size="12" fill="#F472B6" text-anchor="start" letter-spacing=".6">LIVE · IPCV PBL</text>
<text x="28" y="104" class="sans b" font-size="38" fill="#E6EDF3" text-anchor="start" >MalariaVision</text>
<text x="29" y="138" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >Spots malaria parasites in blood-smear</text>
<text x="29" y="162" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >cells: OpenCV pipeline + MobileNetV2.</text>
<text x="29" y="234" class="sans b" font-size="32" fill="#F472B6" text-anchor="start" >96.3%</text>
<text x="30" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">ACCURACY</text>
<text x="201" y="234" class="sans b" font-size="32" fill="#F472B6" text-anchor="start" >95.1%</text>
<text x="202" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">RECALL · 900 UNSEEN</text>
<defs><clipPath id="cell"><circle cx="488" cy="162" r="74"/></clipPath></defs>
<circle cx="488" cy="162" r="74" fill="#F472B6" fill-opacity=".08" stroke="#F472B6" stroke-opacity=".6" stroke-width="2"/>
<circle cx="482" cy="168" r="46" fill="none" stroke="#F472B6" stroke-opacity=".16" stroke-width="10"/>
<circle cx="512" cy="140" r="10" fill="#8B5CF6"/>
<circle cx="521" cy="134" r="4" fill="#C4B5FD"/>
<circle cx="512" cy="140" r="12" fill="none" stroke="#F472B6" stroke-width="2"><animate attributeName="r" values="12;32" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle>
<path d="M492 130 v-10 h10 M522 120 h10 v10 M532 150 v10 h-10 M502 160 h-10 v-10" fill="none" stroke="#E6EDF3" stroke-opacity=".8" stroke-width="2"/>
<g clip-path="url(#cell)"><rect x="414" y="88" width="148" height="2.5" fill="#F472B6" opacity=".85"><animate attributeName="y" values="88;236;88" dur="3.6s" repeatCount="indefinite"/></rect></g>
<text x="488" y="264" class="mono" font-size="11" fill="#F472B6" text-anchor="middle" >parasitized</text>
</svg>
