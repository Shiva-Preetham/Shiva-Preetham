<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="ChurnSense: Explainable churn prediction that says who may leave, why, and what to do next.">
<title>ChurnSense: Explainable churn prediction that says who may leave, why, and what to do next.</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace}
.b{font-weight:700}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.flow{stroke-dasharray:4 8;animation:dash 1.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{0%{stroke-dashoffset:var(--len)}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141A35"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#24304D"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
<clipPath id="frame"><rect width="600" height="300" rx="20"/></clipPath>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
<rect width="600" height="300" fill="url(#bg)"/>
<rect width="600" height="300" fill="url(#dots)" opacity=".55"/>
<circle cx="540" cy="30" r="150" fill="#2DD4BF" opacity="0.22" filter="url(#blur)"/><circle cx="80" cy="330" r="120" fill="#A78BFA" opacity="0.1" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="598.5" height="298.5" rx="20" fill="none" stroke="#1F2A44" stroke-width="1.5"/>
<rect x="28" y="26" width="148" height="26" rx="13" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".5"/>
<text x="41" y="43.5" class="mono b" font-size="12" fill="#2DD4BF" text-anchor="start" letter-spacing=".6">LIVE · AGILE PBL</text>
<text x="28" y="104" class="sans b" font-size="38" fill="#E6EDF3" text-anchor="start" >ChurnSense</text>
<text x="29" y="138" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >Explainable churn prediction that says</text>
<text x="29" y="162" class="sans" font-size="17.5" fill="#8B98B0" text-anchor="start" >who may leave, why, and what to do next.</text>
<text x="29" y="234" class="sans b" font-size="32" fill="#2DD4BF" text-anchor="start" >142</text>
<text x="30" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">TESTS · TDD · CI</text>
<text x="201" y="234" class="sans b" font-size="32" fill="#2DD4BF" text-anchor="start" >SHAP</text>
<text x="202" y="258" class="mono" font-size="12" fill="#71809E" text-anchor="start" letter-spacing=".3">REASON PER SCORE</text>
<line x1="404" y1="252" x2="578" y2="252" stroke="#1F2A44" stroke-width="1.5"/>
<line x1="404" y1="133" x2="578" y2="133" stroke="#F87171" stroke-opacity=".5" stroke-dasharray="4 5"/>
<text x="578" y="127.0" class="mono" font-size="10" fill="#F87171" text-anchor="end" fill-opacity=".8">HIGH RISK</text>
<rect x="412" y="200" width="22" height="52" rx="4" fill="#4ADE80" fill-opacity=".85"/>
<rect x="446" y="164" width="22" height="88" rx="4" fill="#FBBF24" fill-opacity=".85"/>
<rect x="480" y="124" width="22" height="128" rx="4" fill="#F87171" fill-opacity=".85"/>
<rect x="514" y="182" width="22" height="70" rx="4" fill="#FBBF24" fill-opacity=".85"/>
<rect x="548" width="22" rx="4" fill-opacity=".9" y="102" height="150" fill="#F87171"><animate attributeName="height" values="150;150;50;50;150" keyTimes="0;.25;.45;.85;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="102;102;202;202;102" keyTimes="0;.25;.45;.85;1" dur="5s" repeatCount="indefinite"/><animate attributeName="fill" values="#F87171;#F87171;#4ADE80;#4ADE80;#F87171" keyTimes="0;.25;.45;.85;1" dur="5s" repeatCount="indefinite"/></rect>
<text x="491" y="274" class="mono" font-size="11" fill="#8B98B0" text-anchor="middle" >act → re-score</text>
</svg>
